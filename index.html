<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ALYA IP LOCATION FINDER</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #080b16;
      color: white;
    }

    .container {
      width: 92%;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 30px;
    }

    .box {
      background: #111827;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.4);
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #374151;
      border-radius: 10px;
      background: #0b1120;
      color: white;
      font-size: 16px;
      outline: none;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #result {
      margin-top: 25px;
      text-align: left;
    }

    .item {
      padding: 10px 0;
      border-bottom: 1px solid #263244;
    }

    .label {
      color: #60a5fa;
      font-weight: bold;
    }

    .error {
      color: #f87171;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>ALYA IP LOCATION FINDER</h1>

    <p class="subtitle">
      Enter an IP address to view its approximate location.
    </p>

    <div class="box">

      <input
        type="text"
        id="ipInput"
        placeholder="Enter an IP address..."
      >

      <button onclick="findLocation()">
        Find Location
      </button>

      <div id="result"></div>

    </div>

  </div>

  <script>
    async function findLocation() {

      const ip = document.getElementById("ipInput").value.trim();
      const result = document.getElementById("result");

      if (!ip) {
        result.innerHTML =
          '<p class="error">Please enter an IP address.</p>';
        return;
      }

      result.innerHTML = "<p>Searching...</p>";

      try {

        const response = await fetch(
          "https://ipapi.co/" + encodeURIComponent(ip) + "/json/"
        );

        const data = await response.json();

        if (data.error) {
          result.innerHTML =
            '<p class="error">Invalid IP address.</p>';
          return;
        }

        result.innerHTML = `
          <div class="item">
            <span class="label">IP Address:</span>
            ${data.ip || "Unknown"}
          </div>

          <div class="item">
            <span class="label">Country:</span>
            ${data.country_name || "Unknown"}
          </div>

          <div class="item">
            <span class="label">City:</span>
            ${data.city || "Unknown"}
          </div>

          <div class="item">
            <span class="label">Region:</span>
            ${data.region || "Unknown"}
          </div>

          <div class="item">
            <span class="label">Postal Code:</span>
            ${data.postal || "Unknown"}
          </div>

          <div class="item">
            <span class="label">ISP:</span>
            ${data.org || "Unknown"}
          </div>

          <div class="item">
            <span class="label">Latitude:</span>
            ${data.latitude || "Unknown"}
          </div>

          <div class="item">
            <span class="label">Longitude:</span>
            ${data.longitude || "Unknown"}
          </div>
        `;

      } catch (error) {

        result.innerHTML =
          '<p class="error">Could not retrieve location information.</p>';

      }
    }
  </script>

</body>
</html>
